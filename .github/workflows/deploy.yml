шаги:
  - имя: Кассовый репозиторий
    использование: action/checkout@v4

  - имя: Построить изображение Docker
    run: |
      docker build -t go-cicd-app: последний .

  - имя: Остановить предыдущий контейнер
    run: |
      docker rm -f go-cicd-app || true

  - имя: Запустите новый контейнер
    run: |
      докер-ран -d \
        --имелое gicid-app\
        --перезапуск, если не остановить \
        -п 8083:8888 \
        go-cicd-app: последнее

  - имя: Проверить приложение
    run: |
      Спать 5
      завивка --Fail http://localhost:8083
